<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ТехноВзгляд">
    <!-- Тёмно-зелёный квадрат со скруглёнными углами — фон иконки. -->
    <rect width="64" height="64" rx="14" fill="#0f5c5c"/>
    <!-- Белая буква «Т» — первая буква названия сайта. -->
    <path d="M14 20h16v5h-5v19h-6V25h-5z" fill="#ffffff"/>
    <!-- Жёлтая буква «V» — вторая буква названия сайта. -->
    <path d="M34 20h7l3 10 3-10h7l-6 24h-8z" fill="#f2b84b"/>
</svg>
